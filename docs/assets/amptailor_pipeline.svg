<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><defs><style>text{font-family:Arial,"Helvetica Neue",sans-serif;fill:#203040} .main{font-size:29px;font-weight:700} .sub{font-size:19px;fill:#476075} .small{font-size:17px;fill:#476075} .head{font-size:21px;font-weight:700} .tag{font-size:15px;fill:#35566a} .formula{font-size:23px;font-weight:600;fill:#243d53}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#657d8d"/></marker></defs><rect width="1600" height="1050" fill="#fff"/><text x="72" y="64" class="main" style="font-size:37px">AMPTailor</text><text x="72" y="99" class="sub">Multi-stage learning, downstream multi-attribute adaptation and compositional AMP generation</text><text x="72" y="154" class="head">01</text><text x="114" y="154" class="head">PRETRAINING</text><text x="380" y="154" class="head">02</text><text x="422" y="154" class="head">DOMAIN ADAPTATION</text><text x="810" y="154" class="head">03</text><text x="852" y="154" class="head">ATTRIBUTE LEARNING</text><rect x="72" y="195" width="258" height="124" rx="12" fill="#e7f2f8" stroke="#91bdd0" stroke-width="1.6"/><text x="201" y="240" class="main" text-anchor="middle">BasePLM</text><text x="201" y="274" class="small" text-anchor="middle">Swiss-Prot protein sequences</text><text x="201" y="298" class="tag" text-anchor="middle">12-layer decoder-only PLM</text><rect x="382" y="195" width="260" height="124" rx="12" fill="#e6f5f0" stroke="#93cbbd" stroke-width="1.6"/><text x="512" y="239" class="main" text-anchor="middle">PeptidePrior</text><text x="512" y="273" class="small" text-anchor="middle">5–60 aa; length control</text><text x="512" y="296" class="tag" text-anchor="middle">LEN{n}:</text><path d="M 331 257 L 380 257" fill="none" stroke="#657d8d" stroke-width="2.7" marker-end="url(#arr)"/><rect x="699" y="180" width="258" height="112" rx="12" fill="#fceee8" stroke="#d